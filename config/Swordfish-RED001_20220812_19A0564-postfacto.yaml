mode: LAB
simulation:
  playback_speed: 1.0
  loop: false
  meta_file: ../datasets/biologger_meta.csv
  entities:
    - sim_id: sword_postfacto
      tag_id: RED001_20220812
      sampling_rate_hz: 16.0
      clock_source: fixed_frequency
      input_file: ../datasets/Swordfish-RED001_20220812_19A0564/RED001_20220812_19A0564.csv
      calibration:
        compute_attachment_angles: true
        compute_mag_offsets: true
        # The MK10 accelerometer reports specific force (at rest Z = -9.8 m/s/s with +Z out of
        # the base) and RED001's magnetometer reads opposite to the field, the reverse of what
        # the R script assumes. Read as recorded, pitch has the wrong sign and the heading is
        # mirrored north to south, and the dead-reckoned dive passes up to 494 m below the
        # shelf. Negated, +x points forward (its elevation follows the climb rate, +0.91) and
        # the dive stays over the slope.
        sensor_signs: negated
      depth_estimation:
        algorithm: acausal_interpolate
      dead_reckoning:
        # RED001 magnetometer heading is unreliable (datasets/README.md): even with -x, the
        # dead-reckoned track misses the end fix by about 70 degrees. Pinning rotates and
        # scales it onto the fixes and rotates the heading by the same angle, so turns and
        # dives are kept and the body points along its path (fix_interpolation, a straight
        # fix-to-fix line, left the animal swimming sideways or backwards).
        track_model: fix_pinned
      ahrs:
        enabled: false
  zmq:
    port: 5555
    host: "0.0.0.0"
    topic: "biologger/telemetry"
